<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="riceGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="50%" stop-color="#FCEAB3"/>
      <stop offset="100%" stop-color="#E5A638"/>
    </radialGradient>
    <linearGradient id="potGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C2824C"/>
      <stop offset="50%" stop-color="#A56434"/>
      <stop offset="100%" stop-color="#6F3B15"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="#F8F5ED"/>
  
  <!-- Clay Handi / Terracotta Biryani Pot -->
  <circle cx="300" cy="235" r="185" fill="#E8DEC9"/>
  <circle cx="300" cy="235" r="155" fill="url(#potGrad)" filter="drop-shadow(0 14px 28px rgba(41,42,37,0.18))"/>
  <circle cx="300" cy="235" r="138" fill="#8A4822"/>
  <circle cx="300" cy="235" r="130" fill="url(#riceGrad)"/>

  <!-- Biryani Garnish: Golden Fried Onions (Birista) -->
  <path d="M 240 210 Q 255 200 270 215" stroke="#5D3A1A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 330 220 Q 345 205 365 225" stroke="#5D3A1A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 280 260 Q 300 245 320 265" stroke="#5D3A1A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 270 190 Q 290 180 310 195" stroke="#5D3A1A" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Paneer & Veggie Chunks -->
  <rect x="250" y="225" width="28" height="28" rx="4" fill="#FFFFFF" stroke="#E6DCCE" stroke-width="2" transform="rotate(25 264 239)"/>
  <rect x="325" y="240" width="26" height="26" rx="4" fill="#FFFFFF" stroke="#E6DCCE" stroke-width="2" transform="rotate(-15 338 253)"/>
  <circle cx="295" cy="225" r="8" fill="#4CAF50"/>
  <circle cx="350" cy="205" r="7" fill="#4CAF50"/>
  <circle cx="235" cy="250" r="7" fill="#4CAF50"/>

  <!-- Saffron Strands & Mint Leaves -->
  <path d="M 290 205 C 285 190 300 190 295 205 C 290 190 310 195 295 210" fill="#526B4D"/>
  <line x1="285" y1="235" x2="315" y2="242" stroke="#E65100" stroke-width="2.5"/>
  <line x1="260" y1="210" x2="280" y2="218" stroke="#E65100" stroke-width="2"/>
  <line x1="310" y1="250" x2="330" y2="258" stroke="#E65100" stroke-width="2"/>

  <!-- Badge Banner -->
  <rect x="180" y="24" width="240" height="32" rx="16" fill="#526B4D"/>
  <text x="300" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">AWADHI VEG DUM BIRYANI</text>
</svg>
