<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="samosaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E59866"/>
      <stop offset="50%" stop-color="#D35400"/>
      <stop offset="100%" stop-color="#A04000"/>
    </linearGradient>
    <radialGradient id="chutneyGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="80%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </radialGradient>
    <radialGradient id="chutneyRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C0392B"/>
      <stop offset="80%" stop-color="#922B21"/>
      <stop offset="100%" stop-color="#641E16"/>
    </radialGradient>
  </defs>
  <rect width="600" height="450" fill="#F8F5ED"/>
  
  <!-- Serving Platter -->
  <rect x="70" y="80" width="460" height="300" rx="24" fill="#FFFFFF" stroke="#E6DCCE" stroke-width="3" filter="drop-shadow(0 15px 30px rgba(41,42,37,0.12))"/>
  
  <!-- Golden Samosa 1 (Left) -->
  <path d="M 120 280 L 190 140 L 250 280 Z" fill="url(#samosaGrad)" stroke="#873600" stroke-width="3" stroke-linejoin="round" filter="drop-shadow(3px 8px 12px rgba(0,0,0,0.15))"/>
  <path d="M 120 280 Q 185 270 250 280" stroke="#873600" stroke-width="4" fill="none"/>
  <path d="M 185 160 Q 190 230 185 275" stroke="#BA4A00" stroke-width="3" fill="none" opacity="0.6"/>

  <!-- Golden Samosa 2 (Center) -->
  <path d="M 230 290 L 300 130 L 370 290 Z" fill="url(#samosaGrad)" stroke="#873600" stroke-width="3" stroke-linejoin="round" filter="drop-shadow(3px 8px 12px rgba(0,0,0,0.15))"/>
  <path d="M 230 290 Q 300 280 370 290" stroke="#873600" stroke-width="4" fill="none"/>
  <path d="M 298 150 Q 302 230 298 285" stroke="#BA4A00" stroke-width="3" fill="none" opacity="0.6"/>

  <!-- Chutney Bowls -->
  <!-- Green Mint-Coriander Chutney -->
  <circle cx="430" cy="180" r="42" fill="#8D6E63" stroke="#5D4037" stroke-width="3"/>
  <circle cx="430" cy="180" r="35" fill="url(#chutneyGreen)"/>
  <circle cx="426" cy="176" r="4" fill="#A5D6A7"/>

  <!-- Sweet Tamarind Saunth Chutney -->
  <circle cx="430" cy="275" r="42" fill="#8D6E63" stroke="#5D4037" stroke-width="3"/>
  <circle cx="430" cy="275" r="35" fill="url(#chutneyRed)"/>
  <circle cx="426" cy="271" r="4" fill="#EF9A9A"/>

  <!-- Fried Green Chillies Garnish -->
  <path d="M 160 305 Q 210 325 260 305" stroke="#2E7D32" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 290 310 Q 330 330 370 310" stroke="#2E7D32" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Badge Banner -->
  <rect x="180" y="24" width="240" height="32" rx="16" fill="#526B4D"/>
  <text x="300" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CRISP PARTY SNACKS</text>
</svg>
