<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="gravyGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E67E22"/>
      <stop offset="60%" stop-color="#D35400"/>
      <stop offset="100%" stop-color="#9C3A00"/>
    </radialGradient>
    <linearGradient id="bowlGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8C6239"/>
      <stop offset="50%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#5C3D1E"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="#F8F5ED"/>
  
  <!-- Wooden Placemat / Pattern -->
  <circle cx="300" cy="225" r="195" fill="#EFE8D8" stroke="#D99A64" stroke-width="2" stroke-dasharray="8,6"/>
  
  <!-- Brass Handi / Bowl Rim -->
  <circle cx="300" cy="225" r="160" fill="url(#bowlGrad)" filter="drop-shadow(0 15px 30px rgba(41,42,37,0.18))"/>
  <circle cx="300" cy="225" r="142" fill="#E8A855"/>
  <circle cx="300" cy="225" r="135" fill="url(#gravyGrad)"/>
  
  <!-- Swirl of Cream -->
  <path d="M 240 210 Q 300 170 360 210 Q 380 250 330 270 Q 270 280 260 240 Q 250 220 290 220" fill="none" stroke="#FFFBF0" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  
  <!-- Paneer Cubes -->
  <g transform="translate(260, 180) rotate(15)">
    <rect width="40" height="40" rx="4" fill="#FFFFFF" stroke="#F0E6D2" stroke-width="2" filter="drop-shadow(2px 4px 6px rgba(0,0,0,0.15))"/>
    <line x1="8" y1="6" x2="32" y2="6" stroke="#E67E22" stroke-width="3" opacity="0.6"/>
  </g>
  <g transform="translate(310, 205) rotate(-20)">
    <rect width="42" height="42" rx="4" fill="#FFFFFF" stroke="#F0E6D2" stroke-width="2" filter="drop-shadow(2px 4px 6px rgba(0,0,0,0.15))"/>
    <line x1="8" y1="34" x2="32" y2="34" stroke="#E67E22" stroke-width="3" opacity="0.6"/>
  </g>
  <g transform="translate(230, 230) rotate(35)">
    <rect width="38" height="38" rx="4" fill="#FFFFFF" stroke="#F0E6D2" stroke-width="2" filter="drop-shadow(2px 4px 6px rgba(0,0,0,0.15))"/>
  </g>
  <g transform="translate(295, 255) rotate(5)">
    <rect width="36" height="36" rx="4" fill="#FFFFFF" stroke="#F0E6D2" stroke-width="2" filter="drop-shadow(2px 4px 6px rgba(0,0,0,0.15))"/>
  </g>

  <!-- Fresh Coriander Garnishes -->
  <path d="M 295 210 C 290 195 305 195 300 210 C 295 195 315 200 300 215" fill="#526B4D"/>
  <circle cx="340" cy="180" r="3" fill="#2E7D32"/>
  <circle cx="250" cy="185" r="3" fill="#2E7D32"/>
  <circle cx="320" cy="270" r="3" fill="#2E7D32"/>

  <!-- Badge Banner -->
  <rect x="180" y="24" width="240" height="32" rx="16" fill="#526B4D"/>
  <text x="300" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SHAHI PANEER GRAVY</text>
</svg>
