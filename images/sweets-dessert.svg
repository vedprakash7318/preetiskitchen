<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="jamunGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#803520"/>
      <stop offset="50%" stop-color="#4E190C"/>
      <stop offset="100%" stop-color="#230803"/>
    </radialGradient>
    <radialGradient id="syrupGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="70%" stop-color="#FDCB6E"/>
      <stop offset="100%" stop-color="#E17055"/>
    </radialGradient>
    <linearGradient id="bowlSilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0E0E0"/>
      <stop offset="50%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#9E9E9E"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="#F8F5ED"/>
  
  <!-- Silver Dessert Bowl -->
  <circle cx="300" cy="230" r="180" fill="url(#bowlSilver)" filter="drop-shadow(0 15px 30px rgba(41,42,37,0.16))"/>
  <circle cx="300" cy="230" r="150" fill="#E6DCCE"/>
  <circle cx="300" cy="230" r="142" fill="url(#syrupGrad)"/>

  <!-- Rose Petals in Syrup -->
  <ellipse cx="230" cy="180" rx="14" ry="8" fill="#C0392B" opacity="0.8" transform="rotate(30 230 180)"/>
  <ellipse cx="370" cy="270" rx="14" ry="8" fill="#C0392B" opacity="0.8" transform="rotate(-20 370 270)"/>
  <ellipse cx="250" cy="280" rx="12" ry="7" fill="#C0392B" opacity="0.8" transform="rotate(45 250 280)"/>

  <!-- Gulab Jamun 1 (Top Left) -->
  <circle cx="255" cy="205" r="48" fill="url(#jamunGrad)" filter="drop-shadow(3px 8px 10px rgba(0,0,0,0.25))"/>
  <ellipse cx="242" cy="190" rx="14" ry="7" fill="#FFFFFF" opacity="0.3" transform="rotate(-30 242 190)"/>
  <!-- Pistachio Sliver -->
  <ellipse cx="260" cy="200" rx="8" ry="3" fill="#2ECC71" transform="rotate(40 260 200)"/>

  <!-- Gulab Jamun 2 (Right) -->
  <circle cx="340" cy="215" r="48" fill="url(#jamunGrad)" filter="drop-shadow(3px 8px 10px rgba(0,0,0,0.25))"/>
  <ellipse cx="327" cy="200" rx="14" ry="7" fill="#FFFFFF" opacity="0.3" transform="rotate(-30 327 200)"/>
  <ellipse cx="345" cy="210" rx="8" ry="3" fill="#2ECC71" transform="rotate(-30 345 210)"/>

  <!-- Gulab Jamun 3 (Bottom Center) -->
  <circle cx="295" cy="275" r="48" fill="url(#jamunGrad)" filter="drop-shadow(3px 8px 10px rgba(0,0,0,0.25))"/>
  <ellipse cx="282" cy="260" rx="14" ry="7" fill="#FFFFFF" opacity="0.3" transform="rotate(-30 282 260)"/>
  <ellipse cx="300" cy="270" rx="8" ry="3" fill="#2ECC71" transform="rotate(15 300 270)"/>

  <!-- Saffron Strands -->
  <line x1="285" y1="180" x2="305" y2="175" stroke="#D35400" stroke-width="2.5"/>
  <line x1="330" y1="280" x2="350" y2="285" stroke="#D35400" stroke-width="2.5"/>

  <!-- Badge Banner -->
  <rect x="180" y="24" width="240" height="32" rx="16" fill="#526B4D"/>
  <text x="300" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">DESSERTS & GULAB JAMUN</text>
</svg>
